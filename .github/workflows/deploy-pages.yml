# Pushes ONLY npm run build output to branch `gh-pages` (orphan, single commit).
#
# GitHub Pages must publish THAT branch — not `main`.
#   Settings → Pages → Build and deployment → Deploy from a branch
#   → Branch: gh-pages → Folder: / (root)
name: Deploy site to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Verify dist is a production build (not dev index.html)
        run: |
          test -f dist/index.html
          grep -qE '/assets/[^"]+\.js' dist/index.html || { echo "dist/index.html must load hashed JS from /assets/"; exit 1; }
          if grep -q '/src/main\.jsx' dist/index.html; then
            echo "dist/index.html still references dev /src/main.jsx — build is wrong"
            exit 1
          fi

      - name: Publish dist to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: Deploy ${{ github.sha }}
