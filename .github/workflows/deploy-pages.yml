name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Verify colleague invitation has no other event dates
        run: |
          if grep -Eiq '11, 13|March 11|11 March|13 March|Haldi|Mehendi|Baraat|Sangeet|Three days' dist/index.html dist/assets/*.js; then
            echo "Colleague build contains earlier celebration details"
            exit 1
          fi
          test -f dist/og-wedding-2027.jpg
          test ! -e dist/og-couple-2027.jpg

      - name: Verify dist is a production build (not dev index.html)
        run: |
          test -f dist/index.html
          grep -qE '/assets/[^"]+\.js' dist/index.html || { echo "dist/index.html must load hashed JS from /assets/"; exit 1; }
          if grep -q '/src/main\.jsx' dist/index.html; then
            echo "dist/index.html still references dev /src/main.jsx — build is wrong"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
