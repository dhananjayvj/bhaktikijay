# Pushes ONLY npm run build output to branch `gh-pages` (orphan, single commit).
#
# GitHub Pages must publish THAT branch — not `main`.
#   Settings → Pages → Build and deployment → Deploy from a branch
#   → Branch: gh-pages → Folder: / (root)
#
# If Pages is set to "main" / (root), the live site will serve the Vite *source*
# index.html (<script src="/src/main.jsx">) and the app will be blank — built
# assets live under /assets/ only after `vite build` in dist/.
name: Deploy site to gh-pages

# Runs on every commit pushed to main → rebuilds dist/ and updates gh-pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Verify dist is a production build (not dev index.html)
        run: |
          test -f dist/index.html
          grep -qE '/assets/[^"]+\.js' dist/index.html || { echo "dist/index.html must load hashed JS from /assets/"; exit 1; }
          if grep -q '/src/main\.jsx' dist/index.html; then
            echo "dist/index.html still references dev /src/main.jsx — build is wrong"
            exit 1
          fi

      - name: Publish dist to gh-pages branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          worktree=$(mktemp -d)
          cp -a dist/. "$worktree/"
          cd "$worktree"
          git init -b gh-pages
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"

          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
